[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".venv", "venv", "env", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencv-video-background-remover"
version = "0.1.0"
requires-python = ">=3.12"
